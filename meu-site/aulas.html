<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAANAIM - Biblioteca de Aulas</title>
    <link rel="icon" href="Thumb.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --verde-principal: #10b981;
            --azul-neon: #3b82f6;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(16,185,129,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(16,185,129,0.1) 0%, transparent 50%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        h1, h2, h3, .brand-text {
            font-family: 'Orbitron', monospace;
        }
        
        .glass { 
            background: rgba(255,255,255,0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .neon-glow { 
            box-shadow: 0 0 20px rgba(16,185,129,0.3), 0 0 40px rgba(16,185,129,0.1);
        }
        
        .neon-blue { 
            box-shadow: 0 0 20px rgba(59,130,246,0.3), 0 0 40px rgba(59,130,246,0.1);
        }
        
        .video-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        
        .video-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        
        .video-card:hover .card-thumbnail img {
            transform: scale(1.1);
        }
        
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-card:hover .play-overlay {
            opacity: 1;
        }
        
        .play-btn {
            width: 60px;
            height: 60px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.8);
            transition: transform 0.3s;
        }
        
        .video-card:hover .play-btn {
            transform: scale(1);
        }
        
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: linear-gradient(45deg, #10b981, #3b82f6);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            10%, 90% { opacity: 0.8; }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        
        .category-btn.active {
            background: linear-gradient(45deg, #10b981, #059669);
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16,185,129,0.4);
        }
        
        .player-container {
            aspect-ratio: 16/9;
        }
        
        .player-iframe {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            border: none;
        }
        
        .scanline { 
            position: absolute; 
            top: 0; height: 2px; 
            width: 200px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            animation: scan 3s linear infinite; 
        }
        
        @keyframes scan {
            0% { left: -200px; }
            100% { left: 100%; }
        }
        
        .hud-element {
            background: linear-gradient(45deg, rgba(16,185,129,0.15), rgba(59,130,246,0.15));
            border: 1px solid rgba(16,185,129,0.3);
        }
        
        /* Cores das categorias */
        .cat-badge-estudos { background: rgba(16,185,129,0.2); color: #10b981; }
        .cat-badge-pregcacoes { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .cat-badge-cursos { background: rgba(139,92,246,0.2); color: #8b5cf6; }
        .cat-badge-jovens { background: rgba(239,68,68,0.2); color: #ef4444; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        
        /* Modal PDF */
        #pdfModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        
        #pdfModal.active {
            display: flex;
        }
        
        #pdfModal .pdf-container {
            width: 90%;
            height: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        
        #pdfModal embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="text-white min-h-screen relative">
    
    <!-- Partículas de fundo -->
    <div class="particles" id="particles"></div>

    <!-- Header Futurista -->
    <header class="glass rounded-b-2xl mx-4 mt-4 relative z-10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-gradient-to-r from-emerald-500 to-cyan-500 rounded-xl flex items-center justify-center neon-glow">
                    <i class="fas fa-play-circle text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-wider brand-text">MAANAIM</h1>
                    <p class="text-xs text-emerald-400 tracking-widest">BIBLIOTECA DE AULAS</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <a href="membro.html" class="glass px-4 py-2 rounded-lg text-sm hover:bg-white/10 transition-all">
                    <i class="fas fa-users mr-2"></i>Área do Membro
                </a>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        
        <!-- Página Início (Grid de vídeos) -->
        <div id="page-inicio">
            <!-- Barra de pesquisa -->
            <div class="glass rounded-2xl p-6 mb-8 relative overflow-hidden">
                <div class="scanline"></div>
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <div class="flex-1 relative w-full">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-emerald-400"></i>
                        <input type="text" id="searchInput" placeholder="Buscar aulas..." 
                               class="w-full pl-12 pr-4 py-3 bg-black/30 border border-emerald-500/20 rounded-xl text-white placeholder-gray-500 focus:border-emerald-400 focus:outline-none transition-all">
                    </div>
                    <div class="flex gap-2 flex-wrap justify-center">
                        <button onclick="showCategoria('all')" class="category-btn active glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="all">
                            <i class="fas fa-th-large mr-2"></i>Todas
                        </button>
                        <button onclick="showCategoria('estudos')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="estudos">
                            📖 Estudos
                        </button>
                        <button onclick="showCategoria('pregcacoes')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="pregcacoes">
                            🎤 Pregações
                        </button>
                        <button onclick="showCategoria('cursos')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="cursos">
                            🎓 Cursos
                        </button>
                        <button onclick="showCategoria('jovens')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="jovens">
                            🔥 Juventude
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Contadores -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-emerald-400" id="count-all">0</div>
                    <div class="text-xs text-gray-400">Total de Aulas</div>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-emerald-400" id="count-estudos">0</div>
                    <div class="text-xs text-gray-400">Estudos</div>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-amber-400" id="count-pregcacoes">0</div>
                    <div class="text-xs text-gray-400">Pregações</div>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-purple-400" id="count-jovens">0</div>
                    <div class="text-xs text-gray-400">Juventude</div>
                </div>
            </div>
            
            <!-- Título da categoria -->
            <h2 id="categoria-titulo" class="text-2xl font-black mb-6 brand-text">
                <i class="fas fa-fire text-emerald-400 mr-2"></i>Todas as Aulas
            </h2>
            
            <!-- Grid de Vídeos -->
            <div id="grid-aulas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Vídeos serão carregados aqui -->
            </div>
        </div>

        <!-- Página Player (Video + Info) -->
        <div id="page-player" style="display: none;">
            <button onclick="showPage('inicio')" class="glass px-4 py-2 rounded-lg mb-4 hover:bg-white/10 transition-all">
                <i class="fas fa-arrow-left mr-2"></i>Voltar
            </button>
            
            <!-- Player de Vídeo -->
            <div class="glass rounded-2xl p-4 neon-glow mb-6">
                <div class="player-container bg-black rounded-xl overflow-hidden">
                    <iframe id="mainVideo" class="player-iframe" src="" tabindex="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
            
            <!-- Info do Vídeo -->
            <div class="glass rounded-2xl p-6">
                <h1 id="mainVideoTitle" class="text-2xl font-black mb-4 brand-text">Selecione uma aula</h1>
                
                <div class="flex items-center gap-4 text-sm text-gray-400 mb-4">
                    <span id="mainVideoAuthor"><i class="fas fa-user mr-1"></i> MAANAIM</span>
                    <span>•</span>
                    <span id="mainVideoViews">0 visualizações</span>
                </div>
                
                <!-- Descrição -->
                <div id="mainVideoDesc" class="bg-black/20 rounded-xl p-4 mb-4" style="display: none;">
                    <!-- Conteúdo da descrição -->
                </div>
                
                <!-- Botão do PDF -->
                <div id="mainVideoPdf" style="display: none;">
                    <button onclick="openPdfViewer()" class="glass px-6 py-3 rounded-xl font-bold hover:bg-red-500/20 hover:border-red-500 transition-all flex items-center gap-3">
                        <i class="fas fa-file-pdf text-red-400 text-xl"></i>
                        <span>Visualizar Material em PDF</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal do PDF -->
    <div id="pdfModal" onclick="closePdfViewer(event)">
        <div class="pdf-container" onclick="event.stopPropagation()">
            <embed id="pdfModalEmbed" type="application/pdf">
        </div>
    </div>

    <script src="js/script.js?v=11"></script>
    <script src="js/aulas.js?v=3"></script>
    <script>
        // Função para parseContentImages (necessária para o showVideo)
        function parseContentImages(text) {
            if (!text) return '';
            return text;
        }
    </script>
</body>
</body>
</html>
