<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAANAIM - Biblioteca de Aulas</title>
    <link rel="icon" href="Thumb.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --verde-principal: #10b981;
            --azul-neon: #3b82f6;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(16,185,129,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(16,185,129,0.1) 0%, transparent 50%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        h1, h2, h3, .brand-text {
            font-family: 'Orbitron', monospace;
        }
        
        .glass { 
            background: rgba(255,255,255,0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .neon-glow { 
            box-shadow: 0 0 20px rgba(16,185,129,0.3), 0 0 40px rgba(16,185,129,0.1);
        }
        
        .neon-blue { 
            box-shadow: 0 0 20px rgba(59,130,246,0.3), 0 0 40px rgba(59,130,246,0.1);
        }
        
        .video-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        
        .video-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        
        .video-card:hover .card-thumbnail img {
            transform: scale(1.1);
        }
        
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-card:hover .play-overlay {
            opacity: 1;
        }
        
        .play-btn {
            width: 60px;
            height: 60px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.8);
            transition: transform 0.3s;
        }
        
        .video-card:hover .play-btn {
            transform: scale(1);
        }
        
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: linear-gradient(45deg, #10b981, #3b82f6);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            10%, 90% { opacity: 0.8; }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        
        .category-btn.active {
            background: linear-gradient(45deg, #10b981, #059669);
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16,185,129,0.4);
        }
        
        .player-container {
            aspect-ratio: 16/9;
        }
        
        .player-iframe {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            border: none;
        }
        
        .scanline { 
            position: absolute; 
            top: 0; height: 2px; 
            width: 200px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            animation: scan 3s linear infinite; 
        }
        
        @keyframes scan {
            0% { left: -200px; }
            100% { left: 100%; }
        }
        
        .hud-element {
            background: linear-gradient(45deg, rgba(16,185,129,0.15), rgba(59,130,246,0.15));
            border: 1px solid rgba(16,185,129,0.3);
        }
        
        /* Cores das categorias */
        .cat-badge-estudos { background: rgba(16,185,129,0.2); color: #10b981; }
        .cat-badge-pregcacoes { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .cat-badge-cursos { background: rgba(139,92,246,0.2); color: #8b5cf6; }
        .cat-badge-jovens { background: rgba(239,68,68,0.2); color: #ef4444; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        
        /* Modal PDF */
        #pdfModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        
        #pdfModal.active {
            display: flex;
        }
        
        #pdfModal .pdf-container {
            width: 90%;
            height: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        
        #pdfModal embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="text-white min-h-screen relative">
    
    <!-- Partículas de fundo -->
    <div class="particles" id="particles"></div>

    <!-- Header Futurista -->
    <header class="glass rounded-b-2xl mx-4 mt-4 relative z-10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-gradient-to-r from-emerald-500 to-cyan-500 rounded-xl flex items-center justify-center neon-glow">
                    <i class="fas fa-play-circle text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-wider brand-text">MAANAIM</h1>
                    <p class="text-xs text-emerald-400 tracking-widest">BIBLIOTECA DE AULAS</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <a href="membro.html" class="glass px-4 py-2 rounded-lg text-sm hover:bg-white/10 transition-all">
                    <i class="fas fa-users mr-2"></i>Área do Membro
                </a>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        
        <!-- Página Início (Grid de vídeos) -->
        <div id="page-inicio">
            <!-- Barra de pesquisa -->
            <div class="glass rounded-2xl p-6 mb-8 relative overflow-hidden">
                <div class="scanline"></div>
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <div class="flex-1 relative w-full">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-emerald-400"></i>
                        <input type="text" id="searchInput" placeholder="Buscar aulas..." 
                               class="w-full pl-12 pr-4 py-3 bg-black/30 border border-emerald-500/20 rounded-xl text-white placeholder-gray-500 focus:border-emerald-400 focus:outline-none transition-all">
                    </div>
                    <div class="flex gap-2 flex-wrap justify-center">
                        <button onclick="showCategoria('all')" class="category-btn active glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="all">
                            <i class="fas fa-th-large mr-2"></i>Todas
                        </button>
                        <button onclick="showCategoria('estudos')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="estudos">
                            📖 Estudos
                        </button>
                        <button onclick="showCategoria('pregcacoes')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="pregcacoes">
                            🎤 Pregações
                        </button>
                        <button onclick="showCategoria('cursos')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="cursos">
                            🎓 Cursos
                        </button>
                        <button onclick="showCategoria('jovens')" class="category-btn glass px-4 py-2 rounded-lg text-sm font-medium transition-all" data-cat="jovens">
                            🔥 Juventude
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Contadores -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-emerald-400" id="count-all">0</div>
                    <div class="text-xs text-gray-400">Total de Aulas</div>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-emerald-400" id="count-estudos">0</div>
                    <div class="text-xs text-gray-400">Estudos</div>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-amber-400" id="count-pregcacoes">0</div>
                    <div class="text-xs text-gray-400">Pregações</div>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <div class="text-2xl font-black text-purple-400" id="count-jovens">0</div>
                    <div class="text-xs text-gray-400">Juventude</div>
                </div>
            </div>
            
            <!-- Título da categoria -->
            <h2 id="categoria-titulo" class="text-2xl font-black mb-6 brand-text">
                <i class="fas fa-fire text-emerald-400 mr-2"></i>Todas as Aulas
            </h2>
            
            <!-- Grid de Vídeos -->
            <div id="grid-aulas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Vídeos serão carregados aqui -->
            </div>
        </div>

        <!-- Página Player (Video + Info) -->
        <div id="page-player" style="display: none;">
            <button onclick="showPage('inicio')" class="glass px-4 py-2 rounded-lg mb-4 hover:bg-white/10 transition-all">
                <i class="fas fa-arrow-left mr-2"></i>Voltar
            </button>
            
            <!-- Player de Vídeo -->
            <div class="glass rounded-2xl p-4 neon-glow mb-6">
                <div class="player-container bg-black rounded-xl overflow-hidden">
                    <iframe id="mainVideo" class="player-iframe" src="" tabindex="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
            
            <!-- Info do Vídeo -->
            <div class="glass rounded-2xl p-6">
                <h1 id="mainVideoTitle" class="text-2xl font-black mb-4 brand-text">Selecione uma aula</h1>
                
                <div class="flex items-center gap-4 text-sm text-gray-400 mb-4">
                    <span id="mainVideoAuthor"><i class="fas fa-user mr-1"></i> MAANAIM</span>
                    <span>•</span>
                    <span id="mainVideoViews">0 visualizações</span>
                </div>
                
                <!-- Descrição -->
                <div id="mainVideoDesc" class="bg-black/20 rounded-xl p-4 mb-4" style="display: none;">
                    <!-- Conteúdo da descrição -->
                </div>
                
                <!-- Botão do PDF -->
                <div id="mainVideoPdf" style="display: none;">
                    <button onclick="openPdfViewer()" class="glass px-6 py-3 rounded-xl font-bold hover:bg-red-500/20 hover:border-red-500 transition-all flex items-center gap-3">
                        <i class="fas fa-file-pdf text-red-400 text-xl"></i>
                        <span>Visualizar Material em PDF</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal do PDF -->
    <div id="pdfModal" onclick="closePdfViewer(event)">
        <div class="pdf-container" onclick="event.stopPropagation()">
            <embed id="pdfModalEmbed" type="application/pdf">
        </div>
    </div>

    <script src="js/script.js?v=11"></script>
    <script>
        let allVideos = [];
        let currentPdfPath = '';
        const cores = ['from-emerald-900/50 to-cyan-900/30', 'from-cyan-900/50 to-blue-900/30', 'from-purple-900/50 to-pink-900/30', 'from-amber-900/50 to-orange-900/30'];
        
        // Inicializar partículas
        function createParticles() {
            const particles = document.getElementById('particles');
            for(let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
                particles.appendChild(particle);
            }
        }
        createParticles();
        
        // Carregar vídeos
        async function loadVideos() {
            console.log('[DEBUG] Carregando vídeos...');
            try {
                const response = await fetch('/api/aulas');
                allVideos = await response.json();
                console.log('[DEBUG] Vídeos carregados:', allVideos.length);
                
                // Atualizar contadores
                document.getElementById('count-all').textContent = allVideos.length;
                document.getElementById('count-estudos').textContent = allVideos.filter(v => v.categoria === 'estudos').length;
                document.getElementById('count-pregcacoes').textContent = allVideos.filter(v => v.categoria === 'pregcacoes').length;
                document.getElementById('count-jovens').textContent = allVideos.filter(v => v.categoria === 'jovens').length;
                
                renderVideos(allVideos);
            } catch (error) {
                console.error('[DEBUG] Erro ao carregar:', error);
            }
        }
        
        // Renderizar vídeos
        function renderVideos(videos) {
            const grid = document.getElementById('grid-aulas');
            if (videos.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12"><i class="fas fa-video-slash text-4xl text-gray-600 mb-4"></i><p class="text-gray-400">Nenhuma aula encontrada.</p></div>';
                return;
            }
            
            grid.innerHTML = videos.map((video, index) => {
                const videoId = extractVideoId(video.video_url);
                const thumbnail = video.thumbnail || 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
                const cor = cores[index % cores.length];
                const catBadge = getCatBadge(video.categoria);
                
                return `
                    <div class="video-card glass rounded-2xl overflow-hidden cursor-pointer" onclick="showVideoById(${video.id})">
                        <div class="relative h-44 overflow-hidden">
                            <img src="${thumbnail}" alt="${video.titulo}" class="w-full h-full object-cover transition-transform duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>
                            <div class="play-overlay">
                                <div class="play-btn">
                                    <i class="fas fa-play text-white text-xl ml-1"></i>
                                </div>
                            </div>
                            <div class="absolute top-3 right-3 glass px-2 py-1 rounded-lg text-xs font-bold">
                                <i class="fas fa-clock mr-1"></i>${video.duracao || '00:00'}
                            </div>
                            ${catBadge}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-sm line-clamp-2 mb-2">${video.titulo}</h3>
                            <div class="flex items-center text-xs text-gray-400">
                                <span>${video.autor || 'MAANAIM'}</span>
                                <span class="mx-2">•</span>
                                <span>${video.visualizacoes || 0} visualizações</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function getCatBadge(categoria) {
            const badges = {
                'estudos': '<div class="absolute top-3 left-3 cat-badge-estudos px-2 py-1 rounded-lg text-xs font-bold">📖 Estudos</div>',
                'pregcacoes': '<div class="absolute top-3 left-3 cat-badge-pregcacoes px-2 py-1 rounded-lg text-xs font-bold">🎤 Pregação</div>',
                'cursos': '<div class="absolute top-3 left-3 cat-badge-cursos px-2 py-1 rounded-lg text-xs font-bold">🎓 Curso</div>',
                'jovens': '<div class="absolute top-3 left-3 cat-badge-jovens px-2 py-1 rounded-lg text-xs font-bold">🔥 Juventude</div>'
            };
            return badges[categoria] || '';
        }
        
        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : '';
        }
        
        let currentVideoId = null;
        let currentAulaId = null;
        let watchStartTime = null;
        let watchTimer = null;
        let totalWatchTime = 0;
        
        console.log('[DEBUG TEMPO] aulas.html carregado - iniciando tracking!');
        
        // Variáveis para o player YouTube
        var player;
        
        // Carregar API do YouTube
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        
        // Listener para mensagens do YouTube (funciona com iframe direto)
        window.addEventListener('message', function(event) {
            // Verificar se a mensagem vem do YouTube
            if (!event.data || typeof event.data !== 'string') return;
            
            try {
                var data = JSON.parse(event.data);
                // playerState: 1=playing, 2=paused, 0=ended, 3=buffering
                if (data.event === 'infoDelivery' && data.info && data.info.playerState !== undefined) {
                    console.log('[DEBUG TEMPO] Estado do player:', data.info.playerState);
                    if (data.info.playerState === 1) {
                        startWatchTimer();
                    } else if (data.info.playerState === 2 || data.info.playerState === 0) {
                        stopWatchTimer();
                    }
                }
            } catch(e) {
                // Não é JSON válido
            }
        });
        
        // SOLUÇÃO: Usar MutationObserver para detectar quando o src do iframe muda
        var videoIframe = document.getElementById('mainVideo');
        var lastSrc = '';
        
        var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'src') {
                    var newSrc = videoIframe.src;
                    if (newSrc && newSrc !== lastSrc && newSrc.includes('youtube.com/embed')) {
                        console.log('[DEBUG TEMPO] Novo vídeo detectado no iframe!');
                        lastSrc = newSrc;
                        // Iniciar timer após 2 segundos
                        setTimeout(function() {
                            if (currentAulaId) {
                                console.log('[DEBUG TEMPO] Vídeo carregado, iniciando timer automaticamente');
                                startWatchTimer();
                            }
                        }, 2000);
                    }
                }
            });
        });
        
        observer.observe(videoIframe, { 
            attributes: true, 
            attributeFilter: ['src'] 
        });
        
        // Também detectar quando a página fica visível/invisível
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('[DEBUG TEMPO] Página oculta - parando timer');
                stopWatchTimer();
            } else if (currentAulaId && videoIframe.src && videoIframe.src.includes('youtube.com/embed')) {
                console.log('[DEBUG TEMPO] Página visível - iniciando timer');
                startWatchTimer();
            }
        });
        
        function onYouTubeIframeAPIReady() {
            console.log('[DEBUG TEMPO] YouTube API Ready, criando player...');
            player = new YT.Player('mainVideo', {
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
            console.log('[DEBUG TEMPO] Player criado!');
        }
        
        function onPlayerStateChange(event) {
            console.log('[DEBUG TEMPO] Estado do player mudou:', event.data);
            // YT.PlayerState.PLAYING = 1
            if (event.data === 1) {
                startWatchTimer();
            } else if (event.data === 2 || event.data === 0) {
                // PAUSED = 2, ENDED = 0
                stopWatchTimer();
            }
        }
        
        function startWatchTimer() {
            if (watchTimer) return; // Já está contando
            console.log('[DEBUG TEMPO] Timer iniciado!');
            watchStartTime = Date.now();
            watchTimer = setInterval(function() {
                const elapsed = Math.floor((Date.now() - watchStartTime) / 1000);
                totalWatchTime = elapsed;
                
                // Enviar tempo a cada 10 segundos
                if (elapsed > 0 && elapsed % 10 === 0) {
                    sendWatchTime();
                }
            }, 1000);
        }
        
        function stopWatchTimer() {
            if (watchTimer) {
                clearInterval(watchTimer);
                watchTimer = null;
            }
            if (totalWatchTime > 0) {
                sendWatchTime();
            }
        }
        
        async function sendWatchTime() {
            if (!currentAulaId || totalWatchTime < 1) return;
            
            console.log('[DEBUG TEMPO] Enviando tempo:', totalWatchTime, 'para aula:', currentAulaId);
            
            try {
                // Buscar token JWT do admin ou usuário logado
                const adminToken = localStorage.getItem('maanaim_admin_token');
                const userData = localStorage.getItem('maanaim_user');
                let token = adminToken;
                
                // Se não tem token admin, mas tem usuário logado, tenta usar
                if (!token && userData) {
                    try {
                        const user = JSON.parse(userData);
                        // Para usuários, precisamos gerar um token JWT ou usar o IP
                        // Por agora, we'll send without auth (o backend usa IP)
                        token = null;
                    } catch(e) {
                        token = null;
                    }
                }
                
                const response = await fetch('/api/aulas/' + currentAulaId + '/tempo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? 'Bearer ' + token : ''
                    },
                    body: JSON.stringify({
                        tempo_assistido: totalWatchTime
                    })
                });
                
                if (!response.ok) {
                    console.log('Tempo enviado (IP registrado)');
                }
            } catch (e) {
                console.log('Erro ao enviar tempo:', e);
            }
        }
        
        function showVideoById(id) {
            // Resetar timer
            stopWatchTimer();
            totalWatchTime = 0;
            
            const video = allVideos.find(v => v.id === id);
            if (video) showVideo(video);
        }
        
        function showVideo(video) {
            currentPdfPath = video.pdf_path || '';
            currentAulaId = video.id;
            currentVideoId = extractVideoId(video.video_url);
            
            // Usar API do YouTube - incluir origin para postMessage funcionar
            // Usar http://localhost:3000 diretamente pois o servidor é HTTP
            var videoUrl = 'https://www.youtube.com/embed/' + currentVideoId + '?rel=0&enablejsapi=1&origin=http://localhost:3000';
            document.getElementById('mainVideo').src = videoUrl;
            document.getElementById('mainVideoTitle').textContent = video.titulo;
            document.getElementById('mainVideoAuthor').innerHTML = '<i class="fas fa-user mr-1"></i> ' + (video.autor || 'MAANAIM');
            document.getElementById('mainVideoViews').textContent = (video.visualizacoes || 0) + ' visualizações';
            
            // Descrição
            const descContainer = document.getElementById('mainVideoDesc');
            if (video.descricao) {
                descContainer.innerHTML = '<strong class="text-emerald-400">Descrição:</strong><br>' + parseContentImages(video.descricao);
                descContainer.style.display = 'block';
            } else {
                descContainer.style.display = 'none';
            }
            
            // PDF
            const pdfContainer = document.getElementById('mainVideoPdf');
            pdfContainer.style.display = video.pdf_path ? 'block' : 'none';
            
            incrementViews(video.id);
            showPage('player');
        }
        
        function showPage(page) {
            document.getElementById('page-inicio').style.display = page === 'inicio' ? 'block' : 'none';
            document.getElementById('page-player').style.display = page === 'player' ? 'block' : 'none';
            
            if (page === 'inicio') {
                document.getElementById('mainVideo').src = '';
                stopWatchTimer(); // Parar o timer quando sair do player
            }
        }
        
        function showCategoria(categoria) {
            // Atualizar botões
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.cat === categoria) btn.classList.add('active');
            });
            
            // Atualizar título
            const titulos = {
                'all': 'Todas as Aulas',
                'estudos': '📖 Estudos Bíblicos',
                'pregcacoes': '🎤 Pregações',
                'cursos': '🎓 Cursos',
                'jovens': '🔥 Juventude'
            };
            document.getElementById('categoria-titulo').innerHTML = '<i class="fas fa-fire text-emerald-400 mr-2"></i>' + (titulos[categoria] || categoria);
            
            // Filtrar vídeos
            const filtrados = categoria === 'all' ? allVideos : allVideos.filter(v => v.categoria === categoria);
            renderVideos(filtrados);
        }
        
        async function incrementViews(id) {
            console.log('[AULAS] incrementViews chamado para ID:', id);
            try {
                // Verificar se há usuário logado
                let usuarioId = null;
                try {
                    const userFromStorage = localStorage.getItem('maanaim_user');
                    console.log('[AULAS] localStorage maanaim_user:', userFromStorage);
                    if (userFromStorage && userFromStorage !== 'null') {
                        const usuarioLogado = JSON.parse(userFromStorage);
                        if (usuarioLogado && usuarioLogado.id) {
                            usuarioId = usuarioLogado.id;
                            console.log('[AULAS] Usuário logado ID:', usuarioId);
                        }
                    }
                } catch (e) {
                    console.log('[AULAS] Erro ao ler usuário do localStorage:', e);
                }
                
                console.log('[AULAS] Enviando requisição para /api/aulas/' + id + '/views');
                await fetch('/api/aulas/' + id + '/views', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ usuario_id: usuarioId })
                }).then(response => {
                    console.log('[AULAS] Response status:', response.status);
                    return response.json();
                }).then(data => {
                    console.log('[AULAS] Visualização registrada:', data);
                }).catch(err => {
                    console.error('[AULAS] Erro ao registrar visualização:', err);
                });
            } catch (e) {
                console.error('Erro ao incrementar visualizações:', e);
            }
        }
        
        function openPdfViewer() {
            const modal = document.getElementById('pdfModal');
            const embed = document.getElementById('pdfModalEmbed');
            if (modal && embed && currentPdfPath) {
                embed.src = currentPdfPath;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
        
        function closePdfViewer(event) {
            if (event.target.id === 'pdfModal') {
                const modal = document.getElementById('pdfModal');
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
        
        // Função para remover acentos
        function normalizeText(text) {
            if (!text) return '';
            return text.toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }
        
        // Busca
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const termo = normalizeText(e.target.value);
            const filtrados = allVideos.filter(v => 
                normalizeText(v.titulo).includes(termo) || 
                (v.descricao && normalizeText(v.descricao).includes(termo))
            );
            renderVideos(filtrados);
        });
        
        // Carregar ao iniciar
        loadVideos();
    </script>
</body>
</html>
