<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Membro - MAANAIM</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- HEADER (IGUAL AO INDEX) -->
    <header class="header">
        <h1>MAANAIM</h1>
        <p class="header-subtitle">Igreja Evangélica da Cidade</p>
        <nav class="nav">
            <a href="index.html">Início</a>
            <a href="programacao.html">Programação</a>
            <a href="biblia.html" data-aba="biblia">Bíblia</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <!-- FORMULÁRIO DE REGISTRO -->
    <section class="section">
        <div class="form-section">
            <div style="text-align: center; margin-bottom: 2rem;">
                <i class="fas fa-user-plus" style="font-size: 4rem; color: var(--verde-principal);"></i>
            </div>
            
            <h2>Cadastre-se na MAANAIM</h2>
            <p style="text-align: center; color: var(--cinza-escuro); margin-bottom: 2rem;">
                Crie sua conta para ter acesso à área exclusiva dos membros
            </p>

            <form id="registerForm" style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: var(--verde-principal); margin-bottom: 0.5rem;">
                    Nome de usuário
                </label>
                <input type="text" name="username" placeholder="Ex: joaosilva" required>

                <label style="font-weight: 600; color: var(--verde-principal); margin-bottom: 0.5rem;">
                    Email
                </label>
                <input type="email" name="email" placeholder="seu@email.com" required>

                <label style="font-weight: 600; color: var(--verde-principal); margin-bottom: 0.5rem;">
                    Senha
                </label>
                <input type="password" name="password" placeholder="Digite sua senha" required>

                <button type="submit">Cadastrar Novo Membro</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem;">
                Já tem conta? <a href="login.html" style="color: var(--dourado); font-weight: 600;">Faça login</a>
            </p>
        </div>
    </section>

    <!-- Footer -->
    <style>
        .footer-novo {
            background-color: #166534;
            color: white;
            padding: 2rem;
        }
        .footer-novo .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .footer-novo .copyright {
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }
        .footer-novo .icones {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .footer-novo .icones a {
            color: white;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s;
            text-decoration: none;
        }
        .footer-novo .icones a:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .footer-novo .icones {
                justify-content: center;
            }
        }
    </style>
    <footer class="footer-novo">
        <div class="logo">MAANAIM</div>
        <div class="copyright">© 2026 - Toda glória a Deus</div>
        <div class="icones">
            <a href="https://www.instagram.com/maanaim_ig" target="_blank" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://linktr.ee/igrejamaanaimrestauracao" target="_blank" title="Linktree">
                <i class="fas fa-link"></i>
            </a>
            <a href="https://www.youtube.com/@IgrejaMaanaimalmtamandare" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
