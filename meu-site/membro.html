<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Membro - MAANAIM</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .membro-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .membro-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .membro-header h1 {
            color: var(--verde-principal);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .membro-header p {
            color: #666;
            font-size: 1.1rem;
        }
        .topicos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-top: 2rem;
        }
        .topico-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: var(--sombra);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .topico-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .topico-card i {
            font-size: 3rem;
            color: var(--dourado);
            margin-bottom: 1rem;
        }
        .topico-card h3 {
            color: var(--verde-principal);
            margin-bottom: 0.5rem;
        }
        .topico-card p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .conteudo-section {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: var(--sombra);
            margin-top: 2rem;
            animation: fadeIn 0.3s ease;
        }
        .conteudo-section.active {
            display: block;
        }
        .conteudo-section h2 {
            color: var(--verde-principal);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }
        .conteudo-section p {
            color: #444;
            line-height: 1.8;
            font-size: 1.05rem;
            overflow: hidden; /* Prevenir collapse com floats */
        }
        .conteudo-section img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
        }
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--verde-principal);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 1.5rem;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        .btn-voltar:hover {
            background: var(--verde-escuro);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .credo-list {
            list-style: none;
            padding: 0;
        }
        .credo-list li {
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        .credo-list li:last-child {
            border-bottom: none;
        }
        .credo-list li i {
            color: var(--dourado);
            margin-top: 0.3rem;
        }
        .aulas-list {
            display: grid;
            gap: 1rem;
        }
        .aula-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid var(--verde-principal);
        }
        .aula-item i {
            color: var(--verde-principal);
            font-size: 1.5rem;
        }
        .aula-item span {
            color: #333;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <h1>MAANAIM</h1>
        <p class="header-subtitle">Igreja Evangélica da Cidade</p>
        <nav class="nav">
            <!-- Navegação será inserida via JavaScript -->
        </nav>
    </header>

    <main class="membro-container">
        <div class="membro-header">
            <h1><i class="fas fa-users"></i> Área do Membro</h1>
            <p>Recursos exclusivos para membros da Igreja Maanaim</p>
        </div>

        <div class="topicos-grid" id="topicosGrid">
            <!-- Cards serão carregados dinamicamente do banco -->
        </div>

        <!-- Container para conteúdo dinâmico -->
        <div id="conteudoContainer"></div>

    </main>

    <!-- Footer -->
    <style>
        .footer-novo {
            background-color: #166534;
            color: white;
            padding: 2rem;
        }
        .footer-novo .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .footer-novo .copyright {
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }
        .footer-novo .icones {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .footer-novo .icones a {
            color: white;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s;
            text-decoration: none;
        }
        .footer-novo .icones a:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .footer-novo .icones {
                justify-content: center;
            }
        }
    </style>
    <footer class="footer-novo">
        <div class="logo">MAANAIM</div>
        <div class="copyright">© 2026 - Toda glória a Deus</div>
        <div class="icones">
            <a href="https://www.instagram.com/maanaim_ig" target="_blank" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://linktr.ee/igrejamaanaimrestauracao" target="_blank" title="Linktree">
                <i class="fas fa-link"></i>
            </a>
            <a href="https://www.youtube.com/@IgrejaMaanaimalmtamandare" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </footer>

    <script src="js/script.js?v=8"></script>
    <script>
        // Logs de depuração para autenticação
        console.log('[MEMBRO] Iniciando verificação de autenticação...');
        
        // Verificar se localStorage está disponível
        try {
            const userFromStorage = localStorage.getItem('maanaim_user');
            console.log('[MEMBRO] Valor no localStorage:', userFromStorage);
            
            const usuarioLogado = userFromStorage ? JSON.parse(userFromStorage) : null;
            console.log('[MEMBRO] Usuárioparseado:', usuarioLogado);
            console.log('[MEMBRO] Role do usuário:', usuarioLogado?.role);
            
            const rolesPermitidos = ['admin', 'conselho', 'membro'];
            console.log('[MEMBRO] Roles permitidos:', rolesPermitidos);
            console.log('[MEMBRO] Role está na lista?:', rolesPermitidos.includes(usuarioLogado?.role));
            
            if (!usuarioLogado) {
                console.log('[MEMBRO] 🚫 Usuário não está logado (usuarioLogado é null/undefined)');
                alert('Esta área é exclusiva para membros. Faça login para acessar.');
                window.location.href = 'login.html';
            } else if (!rolesPermitidos.includes(usuarioLogado.role)) {
                console.log('[MEMBRO] 🚫 Usuário logado mas role não permite acesso:', usuarioLogado.role);
                alert('Esta área é exclusiva para membros. Faça login para acessar.');
                window.location.href = 'login.html';
            } else {
                console.log('[MEMBRO] ✅ Usuário autenticado com role:', usuarioLogado.role);
            }
        } catch (e) {
            console.error('[MEMBRO] ❌ Erro ao verificar autenticação:', e);
            alert('Erro ao verificar autenticação. Faça login novamente.');
            window.location.href = 'login.html';
        }

        // Carregar cards dinamicamente do banco
        async function carregarCardsAreaMembro() {
            try {
                const response = await fetch('/api/area-membro');
                const topicos = await response.json();
                
                const grid = document.getElementById('topicosGrid');
                
                if (!topicos || topicos.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1/-1;">Nenhum conteúdo disponível no momento.</p>';
                    return;
                }
                
                // Ordenar por ordem
                topicos.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
                
                grid.innerHTML = topicos.map(topico => `
                    <div class="topico-card" onclick="mostrarConteudo(${topico.id}, '${topico.categoria}')">
                        <i class="${topico.icone || 'fas fa-file-alt'}"></i>
                        <h3>${topico.titulo}</h3>
                        <p>${topico.descricao || 'Clique para acessar'}</p>
                    </div>
                `).join('') + `
                    <div class="topico-card" onclick="window.location.href='aulas.html'" style="background: linear-gradient(135deg, #1a5c1a, #2d8a2d);">
                        <i class="fas fa-graduation-cap"></i>
                        <h3>AULAS</h3>
                        <p>Vídeo aulas e estudos</p>
                    </div>
                `;
                
            } catch (error) {
                console.error('Erro ao carregar cards:', error);
            }
        }

        // Mostrar conteúdo do card
        function mostrarConteudo(id, categoria) {
            const grid = document.getElementById('topicosGrid');
            const container = document.getElementById('conteudoContainer');
            
            // Esconde os tópicos
            grid.style.display = 'none';
            
            // Busca o conteúdo do banco
            fetch('/api/area-membro')
                .then(res => res.json())
                .then(topicos => {
                    const topico = topicos.find(t => t.id === id);
                    if (topico) {
                        // Se tem PDF, mostra o embed do PDF
                        if (topico.pdf_path) {
                            container.innerHTML = `
                                <button class="btn-voltar" onclick="voltarTopicos()">
                                    <i class="fas fa-arrow-left"></i> Voltar
                                </button>
                                <div class="conteudo-section active">
                                    <h2>${topico.titulo}</h2>
                                    <embed src="${topico.pdf_path}" type="application/pdf" width="100%" height="600px" style="border-radius: 8px; margin-top: 1rem;">
                                    <p style="text-align: center; margin-top: 1rem;">
                                        <a href="${topico.pdf_path}" target="_blank" style="color: var(--verde-principal);">
                                            <i class="fas fa-external-link-alt"></i> Abrir em nova aba
                                        </a>
                                    </p>
                                </div>
                            `;
                        } else if (topico.conteudo) {
                            // Se tem conteúdo de texto - usar parseContentImages para renderizar imagens
                            container.innerHTML = `
                                <button class="btn-voltar" onclick="voltarTopicos()">
                                    <i class="fas fa-arrow-left"></i> Voltar
                                </button>
                                <div class="conteudo-section active">
                                    <h2>${topico.titulo}</h2>
                                    ${parseContentImages(topico.conteudo)}
                                </div>
                            `;
                        } else {
                            // Se não tem nada
                            container.innerHTML = `
                                <button class="btn-voltar" onclick="voltarTopicos()">
                                    <i class="fas fa-arrow-left"></i> Voltar
                                </button>
                                <div class="conteudo-section active">
                                    <h2>${topico.titulo}</h2>
                                    <p style="text-align: center; color: #666; padding: 2rem;">
                                        <i class="fas fa-file-pdf" style="font-size: 3rem; color: var(--dourado); margin-bottom: 1rem;"></i><br>
                                        Em breve este conteúdo estará disponível.
                                    </p>
                                </div>
                            `;
                        }
                    }
                });
        }

        function voltarTopicos() {
            // Esconde todos os conteúdos
            document.getElementById('conteudoContainer').innerHTML = '';
            
            // Mostra os tópicos
            document.getElementById('topicosGrid').style.display = 'grid';
        }

        // Inicializar
        carregarCardsAreaMembro();
    </script>
</body>
</html>
