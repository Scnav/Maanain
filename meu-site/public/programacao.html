<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Programação - MAANAIN</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- HEADER (IGUAL AO INDEX) -->
    <header class="header">
        <h1>MAANAIN</h1>
        <p class="header-subtitle">Igreja Evangélica da Cidade</p>
        <nav class="nav">
            <a href="index.html">Início</a>
            <a href="programacao.html">Programação</a>
            <a href="biblia.html" data-aba="biblia">Bíblia</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <!-- CONTEÚDO PROGRAMAÇÃO -->
    <section class="section">
        <div class="hero">
            <h2>Agenda de Cultos e Eventos</h2>
            <p>Conheça todos os nossos encontros semanais e especiais</p>
        </div>

        <!-- CARDS DE PROGRAMAÇÃO - CARREGADOS DINAMICAMENTE -->
        <div id="cultosContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem;">
            <!-- Cultos serão carregados dinamicamente do banco de dados -->
        </div>

        <!-- EVENTOS ESPECIAIS -->
        <div style="margin-top: 4rem; text-align: center;">
            <h3 style="font-size: 2rem; color: var(--verde-principal); margin-bottom: 2rem;">Eventos Especiais</h3>
            <div id="eventosEspeciaisContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                <!-- Eventos especiais serão carregados dinamicamente -->
            </div>
        </div>
    </section>

    <!-- Modal de Inscrição -->
    <div id="modalInscricao" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="background: white; max-width: 500px; margin: 100px auto; padding: 2rem; border-radius: 20px; text-align: center;">
            <h3 style="color: var(--verde-principal); margin-bottom: 1rem;">Inscrever-se no Evento</h3>
            <p id="eventoTitulo" style="font-weight: 600; margin-bottom: 1.5rem;"></p>
            <form id="formInscricao">
                <input type="hidden" id="eventoId">
                <input type="text" id="inscritoNome" placeholder="Seu nome" required style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 10px;">
                <input type="email" id="inscritoEmail" placeholder="Seu email" style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 10px;">
                <input type="tel" id="inscritoTelefone" placeholder="Seu telefone" style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 10px;">
                <button type="submit" style="background: var(--verde-principal); color: white; border: none; padding: 1rem 2rem; border-radius: 10px; font-size: 1rem; cursor: pointer; margin-right: 0.5rem;">Confirmar Inscrição</button>
                <button type="button" onclick="fecharModal()" style="background: #ccc; color: #333; border: none; padding: 1rem 2rem; border-radius: 10px; font-size: 1rem; cursor: pointer;">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- FOOTER (IGUAL AO INDEX) -->
    <footer class="footer">
        <p>MAANAIN © 2026 – Toda glória a Deus</p>
        <p><a href="mailto:contato@maanain.com.br" style="color: white;">contato@maanain.com.br</a> | (XX) 9XXXX-XXXX</p>
    </footer>

    <script src="js/script.js?v=5"></script>
</body>
</html>
